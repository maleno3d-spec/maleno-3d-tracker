name: Robô de Coleta Maleno 3D

on:
  schedule:
    # Roda automaticamente todos os dias às 09:00 UTC (06:00 do Brasil)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar manualmente com um clique

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar o script de coleta
        run: python coleta.py

      - name: Salvar alterações no produtos.json
        run: |
          git config --global user.name 'Robo Maleno 3D'
          git config --global user.email 'robo@maleno3d.com'
          git add produtos.json
          git commit -m "Atualização automática de produtos [skip ci]" || exit 0
          git push
