name: Atualizar Produtos Maleno 3D Automaticamente

on:
  schedule:
    # Executa todos os dias à meia-noite (Horário UTC)
    - cron: '0 0 * * *'
  # Permite clicar em um botão para executar manualmente
  workflow_dispatch:

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o robô salve alterações no repositório

    steps:
      # 1. Baixa o código do seu repositório
      - name: Baixar repositório
        uses: actions/checkout@v3

      # 2. Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3. Instala a biblioteca de requisições
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Executa o robô Python
      - name: Executar robô de coleta
        run: python robo.py

      # 5. Salva o novo produtos.json atualizado
      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add produtos.json
          git commit -m "bot: atualização automática dos produtos" || exit 0
          git push
