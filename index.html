<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maleno 3D - Tracker de Natal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F5F7] text-[#2C3E50] min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho Maleno 3D -->
        <header class="mb-10 text-center bg-white border border-[#E2E8F0] rounded-2xl p-8 shadow-sm">
            <h1 class="text-3xl font-extrabold text-[#2C3E50] tracking-tight mb-2">
                Maleno <span class="text-[#F39C12]">3D</span> 🎄
            </h1>
            <p class="text-[#7F8C8D] text-sm font-medium">Painel de Monitoramento de Produtos de Natal</p>
            <p class="text-xs text-[#95A5A6] mt-2">Sincronizado automaticamente com a base local</p>
        </header>

        <!-- Grade de Produtos -->
        <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-center text-[#7F8C8D] col-span-2">A carregar produtos atualizados...</p>
        </div>
    </div>

    <script>
        // Função para ler o arquivo produtos.json gerado pelo Python
        async function carregarProdutos() {
            try {
                const resposta = await fetch('produtos.json');
                const produtos = await resposta.json();
                
                const container = document.getElementById("lista-produtos");
                container.innerHTML = "";

                produtos.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "bg-white border border-[#E2E8F0] rounded-xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-[#FFF3CD] text-[#856404]">${p.plataforma}</span>
                                <span class="text-xs font-medium text-[#95A5A6]">🔥 ${p.vendas_estimadas}</span>
                            </div>
                            <h2 class="text-lg font-bold text-[#2C3E50] mb-2">${p.titulo}</h2>
                        </div>
                        <div class="flex items-center justify-between mt-6 pt-4 border-t border-[#EDF2F7]">
                            <span class="text-2xl font-black text-[#27AE60]">R$ ${p.preco.toFixed(2)}</span>
                            <a href="${p.link}" target="_blank" class="bg-[#F39C12] hover:bg-[#D68910] text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow-sm">Ver Oferta</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (erro) {
                console.error("Erro ao carregar produtos:", erro);
                document.getElementById("lista-produtos").innerHTML = `<p class="text-center text-red-500 col-span-2">Erro ao carregar os dados. Certifique-se de abrir a página corretamente.</p>`;
            }
        }

        // Executar ao abrir a página
        carregarProdutos();
    </script>
</body>
</html>
