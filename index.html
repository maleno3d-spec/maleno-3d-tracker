<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maleno 3D - Tracker de Natal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F5F7] text-[#2C3E50] min-h-screen p-4 sm:p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho Maleno 3D -->
        <header class="mb-6 sm:mb-8 text-center bg-white border border-[#E2E8F0] rounded-2xl p-6 sm:p-8 shadow-sm">
            <h1 class="text-3xl font-extrabold text-[#2C3E50] tracking-tight mb-2">
                Maleno <span class="text-[#F39C12]">3D</span> 🎄
            </h1>
            <p class="text-[#7F8C8D] text-sm font-medium mb-4">Painel Inteligente de Monitoramento de Natal</p>
            
            <!-- Barra de Pesquisa e Botão de Recarregar -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center items-center max-w-lg mx-auto">
                <input 
                    type="text" 
                    id="input-busca" 
                    placeholder="Pesquisar por tema (ex: casa, árvore, rena)..." 
                    oninput="filtrarProdutos()"
                    class="w-full px-4 py-2.5 rounded-xl border border-[#CBD5E1] focus:outline-none focus:ring-2 focus:ring-[#F39C12] text-sm bg-[#FAFAFA]"
                >
                <button onclick="carregarProdutos()" class="w-full sm:w-auto bg-[#F39C12] hover:bg-[#D68910] text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-sm whitespace-nowrap cursor-pointer">
                    Atualizar Dados
                </button>
            </div>
            <p id="status-info" class="text-xs text-[#95A5A6] mt-3">Sincronizado com a nuvem da Maleno 3D</p>
        </header>

        <!-- Grade de Produtos -->
        <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-center text-[#7F8C8D] col-span-2 py-10">A carregar produtos da nuvem...</p>
        </div>
    </div>

    <script>
        let todosProdutos = [];

        async function carregarProdutos() {
            const status = document.getElementById("status-info");
            status.textContent = "A atualizar dados...";
            try {
                // Adiciona um parâmetro de tempo (?t=...) para o navegador não puxar versão antiga em cache
                const resposta = await fetch('produtos.json?t=' + new Date().getTime());
                todosProdutos = await resposta.json();
                
                renderizar(todosProdutos);
                status.textContent = "Dados atualizados com sucesso!";
                setTimeout(() => { status.textContent = "Sincronizado com a nuvem da Maleno 3D"; }, 3000);
            } catch (erro) {
                console.error("Erro:", erro);
                document.getElementById("lista-produtos").innerHTML = `<p class="text-center text-red-500 col-span-2">Erro ao carregar os dados.</p>`;
                status.textContent = "Erro ao sincronizar.";
            }
        }

        function renderizar(lista) {
            const container = document.getElementById("lista-produtos");
            container.innerHTML = "";

            if (lista.length === 0) {
                container.innerHTML = `<p class="text-center text-[#7F8C8D] col-span-2 py-8 bg-white rounded-xl border border-[#E2E8F0]">Nenhum produto encontrado com esse termo.</p>`;
                return;
            }

            lista.forEach(p => {
                const card = document.createElement("div");
                card.className = "bg-white border border-[#E2E8F0] rounded-xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-[#FFF3CD] text-[#856404]">${p.plataforma}</span>
                            <span class="text-xs font-medium text-[#95A5A6]">🔥 ${p.vendas_estimadas}</span>
                        </div>
                        <h2 class="text-lg font-bold text-[#2C3E50] mb-2">${p.titulo}</h2>
                    </div>
                    <div class="flex items-center justify-between mt-6 pt-4 border-t border-[#EDF2F7]">
                        <span class="text-2xl font-black text-[#27AE60]">R$ ${p.preco.toFixed(2)}</span>
                        <a href="${p.link}" target="_blank" class="bg-[#F39C12] hover:bg-[#D68910] text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow-sm">Ver Oferta</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filtrarProdutos() {
            const termo = document.getElementById("input-busca").value.toLowerCase();
            const filtrados = todosProdutos.filter(p => p.titulo.toLowerCase().includes(termo) || p.plataforma.toLowerCase().includes(termo));
            renderizar(filtrados);
        }

        // Carregar ao abrir a página
        carregarProdutos();
    </script>
</body>
</html>
